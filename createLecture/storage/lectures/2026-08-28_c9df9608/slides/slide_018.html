<h2 class="heading" data-ref="t">다층 신경망의 수학적 표현</h2>
<ul class="bullets">
  <li data-ref="b1">1번째 은닉층: h₁ = f(W₁x + b₁)</li>
  <li data-ref="b2">2번째 은닉층: h₂ = f(W₂h₁ + b₂)</li>
  <li data-ref="b3">출력층: ŷ = g(W₃h₂ + b₃)</li>
  <li data-ref="b4">전체 신경망: ŷ = F(x; θ)  — θ는 모든 Weight와 Bias의 집합</li>
  <li data-ref="b5">Loss: L(y, ŷ) — 회귀 → MSE, 분류 → Cross Entropy</li>
</ul>
