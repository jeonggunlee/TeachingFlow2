<h2 class="heading" data-ref="t">Fully Connected Layer와 순전파</h2>
<ul class="bullets">
  <li data-ref="b1">Fully Connected: 이전 Layer의 모든 뉴런이 다음 Layer와 연결</li>
  <li data-ref="b2">각 연결마다 독립적인 Weight 존재 — Weight·Bias가 학습 파라미터</li>
  <li data-ref="b3">순전파(Forward Propagation): Input → Hidden → Output으로 데이터 변환</li>
  <li data-ref="b4">Depth(층 수)와 Width(뉴런 수)가 신경망 표현 능력 결정</li>
</ul>
