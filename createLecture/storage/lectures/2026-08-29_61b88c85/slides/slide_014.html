<h2 class="heading" data-ref="t">활성화 함수 (Activation Function)</h2>
<ul class="bullets">
  <li data-ref="b1">역할: 신경망에 비선형성을 추가해 복잡한 패턴 표현 가능</li>
  <li data-ref="b2">Step: 0 또는 1 이진 출력 — 퍼셉트론의 기원</li>
  <li data-ref="b3">Sigmoid / Tanh: 연속적 출력, 기울기 소실 문제 존재</li>
  <li data-ref="b4">ReLU: 가장 널리 사용, max(0, z)로 학습 속도 개선</li>
  <li data-ref="b5">Softmax: 다중 클래스 분류의 최종 출력 확률 변환</li>
</ul>
