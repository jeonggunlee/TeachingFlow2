<h2 class="heading" data-ref="t">뉴런과 Layer의 수식 표현</h2>
<ul class="bullets">
  <li data-ref="b1">단일 뉴런: z = w₁x₁ + w₂x₂ + … + wₙxₙ + b, y = f(z)</li>
  <li data-ref="b2">벡터 표현: z = wᵀx + b, y = f(wᵀx + b)</li>
  <li data-ref="b3">Layer 단위: z = Wx + b, h = f(z) — W는 Weight 행렬</li>
  <li data-ref="b4">다층 신경망: h₁ = f(W₁x + b₁), h₂ = f(W₂h₁ + b₂), ŷ = g(W₃h₂ + b₃)</li>
</ul>
