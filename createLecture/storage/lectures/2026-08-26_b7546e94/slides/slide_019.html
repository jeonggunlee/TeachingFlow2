<h2 class="heading" data-ref="t">Layer와 다층 신경망의 수식 표현</h2>
<ul class="bullets">
  <li data-ref="b1">한 층: z = Wx + b, h = f(z) — Weight Matrix W로 뉴런 전체를 동시에 계산</li>
  <li data-ref="b2">Hidden Layer 1: h₁ = f(W₁x + b₁)</li>
  <li data-ref="b3">Hidden Layer 2: h₂ = f(W₂h₁ + b₂)</li>
  <li data-ref="b4">Output Layer: ŷ = g(W₃h₂ + b₃)</li>
  <li data-ref="b5">전체 신경망 요약: ŷ = F(x ; θ), θ = 모든 Weight·Bias</li>
</ul>
