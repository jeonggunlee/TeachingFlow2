<h2 class="heading" data-ref="t">하나의 뉴런과 하나의 Layer</h2>
<ul class="bullets">
  <li data-ref="b1">뉴런 출력: z = wᵀx + b,  y = f(z)</li>
  <li data-ref="b2">Layer 출력: z = Wx + b,  h = f(z)  (W: 가중치 행렬)</li>
  <li data-ref="b3">다층 신경망: h₁ = f(W₁x+b₁),  h₂ = f(W₂h₁+b₂),  ŷ = g(W₃h₂+b₃)</li>
  <li data-ref="b4">전체 모델: ŷ = F(x; θ)  — θ는 모든 Weight와 Bias</li>
</ul>
