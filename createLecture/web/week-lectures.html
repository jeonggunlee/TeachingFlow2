<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HALLYM EDUTECH — 강의 목록</title>
  <link rel="stylesheet" href="/css/common.css" />
  <style>
    /* ── 상단 바 ───────────────────────────────────── */
    .page-header {
      background: #080e1a;
      border-bottom: 1px solid #1e293b;
      padding: 20px 32px 18px;
    }
    .page-header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .portal-back-btn {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      background: rgba(56,189,248,.2);
      border: 1px solid rgba(56,189,248,.5);
      border-radius: 6px;
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: background .15s;
    }
    .portal-back-btn:hover { background: rgba(56,189,248,.35); color: #fff; }

    .course-chip {
      display: inline-block;
      background: rgba(56,189,248,.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .page-sub {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── 컨텐츠 ────────────────────────────────────── */
    .page-body {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* 상단 액션 바 */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .result-count { font-size: 13px; color: var(--muted); }
    .create-new-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--accent-strong);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: filter .15s;
    }
    .create-new-btn:hover { filter: brightness(1.15); }

    /* 강의 카드 */
    .lecture-card {
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: border-color .15s;
    }
    .lecture-card:hover { border-color: #334155; }
    .lecture-info { flex: 1; min-width: 0; }
    .lecture-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lecture-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lecture-meta-item { font-size: 12px; color: var(--muted); }
    .badge-cqi {
      font-size: 10px;
      font-weight: 700;
      background: rgba(59,130,246,.2);
      border: 1px solid rgba(59,130,246,.4);
      color: #93c5fd;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .lecture-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-play {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 7px 14px;
      background: var(--accent-strong);
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: filter .15s;
    }
    .btn-play:hover { filter: brightness(1.15); }
    .btn-edit {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      background: transparent;
      border: 1px solid #334155;
      border-radius: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, color .15s;
    }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .btn-download {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      background: transparent;
      border: 1px solid #334155;
      border-radius: 7px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .btn-download:hover { border-color: #4ade80; color: #4ade80; }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .empty-desc  { font-size: 14px; margin-bottom: 24px; }

    /* 로딩 */
    .loading { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a id="btn-portal-back" class="nav-portal-back" href="http://localhost:8003">← 포털로 돌아가기</a>
    <a id="nav-logo" href="http://localhost:8003" class="site-nav-logo">🎓 HALLYM EDUTECH</a>
    <span class="site-nav-sep">›</span>
    <span class="nav-brand">TeachingFlow</span>
    <span class="site-nav-sep">›</span>
    <span class="site-nav-page" id="nav-page">강의 목록</span>
  </nav>

  <div class="page-header">
    <div class="page-header-top">
      <span id="course-chip" class="course-chip" style="display:none"></span>
    </div>
    <h1 class="page-title" id="page-title">강의 목록</h1>
    <p class="page-sub" id="page-sub">이 주차를 위해 생성된 강의들입니다.</p>
  </div>

  <div class="page-body">
    <div class="action-bar">
      <span class="result-count" id="result-count"></span>
      <a id="btn-create-new" class="create-new-btn" href="http://localhost:8000">
        📝 새 강의 제작
      </a>
    </div>
    <div id="lecture-list"><div class="loading">로딩 중...</div></div>
  </div>

  <script src="/js/week-lectures.js?v=5" defer></script>
</body>
</html>
