<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HALLYM EDUTECH — 강의 플레이어</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/player.css" />
</head>
<body>

<nav class="site-nav">
  <a id="btn-portal-back" class="nav-portal-back" href="http://localhost:8003">← 포털로 돌아가기</a>
  <a href="/" class="site-nav-logo">HALLYM EDUTECH</a>
  <span class="site-nav-sep">›</span>
  <span class="nav-brand">TeachingFlow</span>
  <span class="site-nav-sep">›</span>
  <span class="site-nav-page">강의 재생</span>
</nav>

<div id="loading-overlay" class="overlay-msg">강의 데이터 로딩 중…</div>

<div class="player-wrap">
  <!-- 헤더 -->
  <div class="player-header">
    <span id="lecture-title" class="lecture-title">—</span>
    <span id="slide-counter" class="slide-counter">— / —</span>
  </div>

  <!-- 슬라이드 + 캔버스 오버레이 -->
  <div class="slide-area">
    <img id="slide-img" class="slide-img" src="" alt="slide" />
    <canvas id="slide-canvas" class="slide-canvas"></canvas>
  </div>

  <!-- 자막 -->
  <div id="subtitle-bar" class="subtitle-bar"></div>

  <!-- 컨트롤 -->
  <div class="controls">
    <a id="btn-back-create" class="ctrl-btn back-create-btn" href="/" title="AI 강의 생성 페이지로 돌아가기">← AI 강의 생성</a>
    <button id="btn-prev"  class="ctrl-btn" title="이전 슬라이드">◀◀</button>
    <button id="btn-play"  class="ctrl-btn primary" title="재생/일시정지">▶ 재생</button>
    <button id="btn-next"  class="ctrl-btn" title="다음 슬라이드">▶▶</button>

    <span id="time-info" class="time-info">00:00 / 00:00</span>

    <span class="effect-toggle">
      강조 효과
      <select id="effect-select">
        <option value="highlighter">형광펜</option>
        <option value="check">체크</option>
        <option value="none">없음</option>
      </select>
    </span>

    <button id="btn-record" class="ctrl-btn record-btn" title="녹화 시작/중지">⏺ 녹화</button>
    <a id="btn-edit-scripts" class="ctrl-btn edit-scripts-btn" title="스크립트·강조 영역 편집">✏️ 편집</a>
  </div>
</div>

<script src="/js/subtitle.js" defer></script>
<script src="/js/overlay.js"  defer></script>
<script src="/js/recorder.js" defer></script>
<script src="/js/player.js?v=2"   defer></script>
</body>
</html>
