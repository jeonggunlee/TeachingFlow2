<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CQI 보고서 — HALLYM EDUTECH</title>
  <link rel="stylesheet" href="/css/common.css?v=3" />
  <link rel="stylesheet" href="/css/analyze.css?v=6" />
</head>
<body>

<nav class="site-nav">
  <a class="nav-portal-back" id="nav-portal-back" href="http://localhost:8003">← 포털로 돌아가기</a>
  <a class="site-nav-logo" href="/">HALLYM EDUTECH</a>
  <span class="site-nav-sep">›</span>
  <span class="nav-brand">TeachingFlow</span>
  <span class="site-nav-sep">›</span>
  <span class="site-nav-page">CQI 보고서</span>
</nav>

<div class="page-body">

  <div id="loading" class="empty-msg">보고서 로딩 중…</div>

  <div id="report-body" hidden>

    <!-- 헤더 -->
    <div class="report-header">
      <div id="report-title" class="report-title"></div>
      <div class="report-meta">
        <span id="report-date"></span>
        <span id="report-slide-count"></span>
        <label class="report-history" id="report-history-wrap" hidden>
          <span class="report-history-caption">분석 이력</span>
          <select id="report-history-select" class="report-history-select"></select>
        </label>
      </div>
    </div>

    <!-- 내보내기 / 강의 제작에 적용 -->
    <div class="export-bar">
      <button class="btn-apply" id="btn-apply-cqi" title="강의 제작 페이지에서 이 보고서를 자동으로 불러옵니다">
        ➜ 강의 제작에 적용
      </button>
      <button class="btn-export" id="btn-export">↓ CQI JSON 내보내기</button>
    </div>

    <!-- 슬라이드별 평균 난이도 그래프 -->
    <div class="diff-graph-section">
      <div class="diff-graph-header">
        <span class="diff-graph-title">슬라이드별 평균 난이도</span>
        <span class="diff-graph-legend">
          <span class="dgl-item dgl-easy">●  쉬움 (0)</span>
          <span class="dgl-item dgl-mid">●  보통 (1)</span>
          <span class="dgl-item dgl-hard">●  어려움 (2)</span>
        </span>
      </div>
      <canvas id="diff-graph-canvas"></canvas>
    </div>

    <!-- 혼란도 히트맵 -->
    <div class="heatmap-wrap">
      <div class="heatmap-title">슬라이드별 혼란도 (클릭하면 해당 슬라이드로 이동)</div>
      <div id="heatmap-row" class="heatmap-row"></div>
    </div>

    <!-- 슬라이드 상세 카드 -->
    <div id="slide-cards" class="slide-cards"></div>

  </div>

</div>

<script src="/js/report.js?v=8"></script>
</body>
</html>
