<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주차별 학습 분석 — HALLYM EDUTECH</title>
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/css/analyze.css?v=3" />
  <style>
    /* ── 포털 컨텍스트 바 ─────────────────────────────── */
    .ctx-bar {
      background: #080e1a;
      border-bottom: 1px solid #1e3a5f;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ctx-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #e0f2fe;
      background: rgba(56,189,248,.2);
      border: 1px solid rgba(56,189,248,.5);
      padding: 5px 14px;
      border-radius: 8px;
      text-decoration: none;
      transition: all .15s;
      flex-shrink: 0;
    }
    .ctx-back:hover { background: rgba(56,189,248,.35); border-color: #38bdf8; color: #fff; }
    .ctx-sep { color: #334155; font-size: 12px; flex-shrink: 0; }
    .ctx-course-chip {
      background: rgba(56,189,248,.15);
      border: 1px solid rgba(56,189,248,.35);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .ctx-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .ctx-week-heading { font-size: 14px; font-weight: 700; color: var(--text); }
    .ctx-week-sub { font-size: 12px; color: var(--muted); }

    /* ── 페이지 헤더 ──────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-header-left { display: flex; flex-direction: column; gap: 4px; }
    .page-title { font-size: 20px; font-weight: 700; }
    .page-sub { font-size: 13px; color: var(--muted); }
    #result-count { font-size: 12px; color: var(--muted); }

    /* ── 강의 카드 ────────────────────────────────────── */
    .lecture-card {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color .15s;
    }
    .lecture-card:hover { border-color: #475569; }
    .lecture-card-info { flex: 1; min-width: 0; }
    .lecture-card-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .lecture-card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lecture-meta-item { font-size: 12px; color: var(--muted); }
    .lecture-card-status { flex-shrink: 0; }
    .lecture-card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      flex-shrink: 0;
      max-width: 60%;
    }

    .btn-start-analyze {
      background: var(--accent-strong);
      color: #fff;
      border: 0;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-start-analyze:hover    { background: var(--accent); }
    .btn-start-analyze:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-view-report {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #064e3b;
      border: 1px solid #10b981;
      color: #6ee7b7;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: all .15s;
    }
    .btn-view-report:hover { background: #065f46; }

    /* 분석 날짜 선택 드롭다운 */
    .report-history-select {
      background: var(--panel);
      border: 1px solid #334155;
      color: var(--fg, #e2e8f0);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      max-width: 200px;
      transition: border-color .15s;
    }
    .report-history-select:hover  { border-color: #475569; }
    .report-history-select:focus  { outline: none; border-color: var(--accent, #6366f1); }

    /* 다시 분석 버튼 */
    .btn-reanalyze {
      background: transparent;
      border: 1px solid #475569;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .btn-reanalyze:hover    { border-color: var(--accent, #6366f1); color: var(--fg, #e2e8f0); }
    .btn-reanalyze:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-retry {
      background: transparent;
      border: 1px solid var(--error);
      color: var(--error);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .btn-retry:hover { background: rgba(248,113,113,.1); }

    /* ── 액션 바 ──────────────────────────────────────── */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-analyze-all {
      background: var(--accent-strong);
      color: #fff;
      border: 0;
      padding: 9px 22px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-analyze-all:hover    { background: var(--accent); }
    .btn-analyze-all:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── 빈 상태 ──────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .empty-desc { font-size: 13px; }

    /* ── 로딩 ─────────────────────────────────────────── */
    .loading { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
  </style>
</head>
<body>

<nav class="site-nav">
  <a id="ctx-back" class="nav-portal-back" href="http://localhost:8003">← 포털로 돌아가기</a>
  <a id="nav-logo" href="http://localhost:8003" class="site-nav-logo" style="cursor:pointer">HALLYM EDUTECH</a>
  <span class="site-nav-sep">›</span>
  <span class="nav-brand">TeachingFlow</span>
  <span class="site-nav-sep">›</span>
  <span class="site-nav-page" id="nav-page">학습 분석</span>
</nav>

<!-- 포털 컨텍스트 바 -->
<div class="ctx-bar" id="ctx-bar" hidden>
  <span class="ctx-course-chip" id="ctx-course"></span>
  <div class="ctx-info">
    <div class="ctx-week-heading" id="ctx-week-heading"></div>
    <div class="ctx-week-sub" id="ctx-week-sub" hidden></div>
  </div>
</div>

<div class="page-body">

  <div class="page-header">
    <div class="page-header-left">
      <div class="page-title" id="page-title">주차별 학습 분석</div>
      <div class="page-sub" id="page-sub"></div>
    </div>
    <span id="result-count"></span>
  </div>

  <div class="action-bar">
    <button class="btn-analyze-all" id="btn-analyze-all" hidden>📊 이 주차 전체 분석 시작</button>
  </div>

  <div id="lecture-list">
    <div class="loading">강의 목록 로딩 중...</div>
  </div>

</div>

<script src="/js/week-analyze.js?v=3"></script>
</body>
</html>
