<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 플레이어 — HALLYM EDUTECH</title>
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/css/player.css?v=3" />
</head>
<body>

<nav class="site-nav">
  <a id="btn-back-list" class="nav-portal-back" href="http://localhost:8003">← 포털로 돌아가기</a>
  <a id="nav-logo" href="http://localhost:8003" class="site-nav-logo">HALLYM EDUTECH</a>
  <span class="site-nav-sep">›</span>
  <span class="nav-brand">TeachingFlow</span>
  <span class="site-nav-sep">›</span>
  <span class="site-nav-page">강의 운영</span>
</nav>

<div id="loading-overlay" class="overlay-msg">강의 데이터 로딩 중…</div>

<!-- 이어보기 배너 -->
<div id="resume-banner" class="resume-banner" hidden>
  <span>이전에 수강한 위치가 있습니다.</span>
  <button class="btn-resume-cont">이어보기</button>
  <button class="btn-dismiss">처음부터</button>
</div>

<div class="player-wrap">

  <!-- 헤더 -->
  <div class="player-header">
    <span id="lecture-title" class="lecture-title">—</span>
    <span id="slide-counter" class="slide-counter">— / —</span>
  </div>

  <!-- 메인 영역: 슬라이드(좌) + 채팅(우) -->
  <div class="player-main">

    <!-- 좌측: 슬라이드 + 자막 + 난이도 -->
    <div class="player-left">

      <!-- 슬라이드 + 캔버스 오버레이 -->
      <div class="slide-area">
        <div id="slide-dom" class="slide-dom" hidden></div>
        <img id="slide-img" class="slide-img" src="" alt="slide" />
        <canvas id="slide-canvas" class="slide-canvas"></canvas>
      </div>

      <!-- 자막 -->
      <div id="subtitle-bar" class="subtitle-bar"></div>

      <!-- 난이도 평가 게이지 -->
      <div class="difficulty-bar">
        <span class="difficulty-label">이 슬라이드 난이도:</span>
        <div class="diff-btns">
          <button class="diff-btn" data-rating="0">😊 쉬움</button>
          <button class="diff-btn" data-rating="1">😐 보통</button>
          <button class="diff-btn" data-rating="2">😰 어려움</button>
        </div>
        <div class="diff-stats" id="diff-stats" title="전체 평가 분포"></div>
      </div>

    </div>

    <!-- 우측: 채팅 + 난이도 그래프 -->
    <div class="player-right">

      <div class="chat-panel">
        <div class="chat-header">
          <span class="chat-header-title">💬 질문 / 토론</span>
          <span class="chat-slide-badge" id="chat-slide-badge">슬라이드 1</span>
        </div>
        <div class="chat-messages" id="chat-messages">
          <span class="chat-empty">이 슬라이드에 대한 질문을 남겨보세요.</span>
        </div>
        <div class="chat-input-wrap">
          <textarea
            id="chat-input"
            class="chat-input"
            placeholder="질문이나 의견을 입력하세요… (Enter: 전송)"
            rows="1"
          ></textarea>
          <button id="chat-send" class="chat-send-btn" title="전송">↑</button>
        </div>
      </div>

      <!-- 실시간 난이도 그래프 -->
      <div class="diff-live-panel">
        <div class="diff-live-header">
          <span class="diff-live-title">📊 슬라이드별 평균 난이도</span>
          <span class="diff-live-scale">0=쉬움 · 1=보통 · 2=어려움</span>
        </div>
        <canvas id="diff-live-canvas"></canvas>
      </div>

    </div>

  </div><!-- .player-main -->

  <!-- 컨트롤 바 -->
  <div class="controls">
    <a id="btn-goto-list" class="ctrl-btn home-btn" href="http://localhost:8003" title="강의 목록으로 가기">← 강의 목록</a>
    <button id="btn-prev"  class="ctrl-btn" title="이전 슬라이드">◀◀</button>
    <button id="btn-play"  class="ctrl-btn primary" title="재생/일시정지">▶ 재생</button>
    <button id="btn-next"  class="ctrl-btn" title="다음 슬라이드">▶▶</button>
    <span id="time-info" class="time-info">00:00 / 00:00</span>
    <span class="effect-toggle">
      강조 효과
      <select id="effect-select">
        <option value="highlighter">형광펜</option>
        <option value="underline">밑줄</option>
        <option value="check">체크</option>
        <option value="none">없음</option>
      </select>
    </span>
    <span class="effect-toggle">
      속도
      <select id="speed-select" title="재생 속도">
        <option value="0.75">0.75x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2.0x</option>
      </select>
    </span>
    <span id="progress-indicator" class="progress-indicator">0%</span>
  </div>

</div><!-- .player-wrap -->

<!-- ── 체크포인트 퀴즈 모달 ────────────────────────────────────── -->
<div id="quiz-modal" class="quiz-modal" hidden>
  <div class="quiz-modal-backdrop"></div>
  <div class="quiz-modal-box" role="dialog" aria-modal="true" aria-labelledby="quiz-modal-q">
    <div class="quiz-modal-header">
      <span class="quiz-modal-tag">📝 체크포인트 퀴즈</span>
      <span id="quiz-modal-slide" class="quiz-modal-slide"></span>
    </div>
    <div id="quiz-modal-q" class="quiz-modal-question">질문 로딩 중…</div>
    <div id="quiz-modal-options" class="quiz-modal-options"></div>
    <div id="quiz-modal-feedback" class="quiz-modal-feedback" hidden></div>
    <div class="quiz-modal-actions">
      <button id="quiz-btn-skip"   class="ctrl-btn">건너뛰기</button>
      <button id="quiz-btn-submit" class="ctrl-btn primary" disabled>답안 제출</button>
      <button id="quiz-btn-next"   class="ctrl-btn primary" hidden>다음 슬라이드 ▶</button>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/subtitle.js"  defer></script>
<script src="/js/slide-stage.js" defer></script>
<script src="/js/overlay.js"   defer></script>
<script src="/js/player.js?v=11" defer></script>
</body>
</html>
