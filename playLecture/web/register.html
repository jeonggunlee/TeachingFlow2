<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 — HALLYM EDUTECH</title>
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/css/auth.css?v=2" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">HALLYM EDUTECH</div>
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-sub">새 계정을 만드세요.</p>

    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label for="username">아이디 <small style="color:var(--muted)">(3~30자, 영문/숫자)</small></label>
        <input id="username" type="text" placeholder="아이디 입력" autocomplete="username"
               minlength="3" maxlength="30" required />
      </div>
      <div class="form-group">
        <label for="display_name">이름 (화면에 표시)</label>
        <input id="display_name" type="text" placeholder="예: 홍길동" maxlength="50" required />
      </div>
      <div class="form-group">
        <label for="password">비밀번호 <small style="color:var(--muted)">(4자 이상)</small></label>
        <input id="password" type="password" placeholder="비밀번호 입력" autocomplete="new-password"
               minlength="4" required />
      </div>
      <div class="form-group">
        <label for="password2">비밀번호 확인</label>
        <input id="password2" type="password" placeholder="비밀번호 재입력" required />
      </div>
      <p id="register-error" class="auth-error"></p>
      <button type="submit" class="auth-btn">회원가입</button>
    </form>

    <div class="auth-footer">
      이미 계정이 있으신가요? <a href="/login">로그인</a>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("register-error");
    errEl.textContent = "";
    const btn = e.target.querySelector("button[type=submit]");

    const username     = document.getElementById("username").value.trim();
    const display_name = document.getElementById("display_name").value.trim();
    const password     = document.getElementById("password").value;
    const password2    = document.getElementById("password2").value;

    if (password !== password2) {
      errEl.textContent = "비밀번호가 일치하지 않습니다.";
      return;
    }

    btn.disabled = true;
    try {
      const res = await fetch("/api/auth/register", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ username, display_name, password }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.detail || "가입 실패"; return; }

      // 가입 후 자동 로그인
      const loginRes = await fetch("/api/auth/login", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ username, password }),
      });
      const loginData = await loginRes.json();
      if (loginRes.ok) {
        Auth.setAuth(loginData.token, loginData.user);
        location.href = "/";
      } else {
        location.href = "/login";
      }
    } catch (err) {
      errEl.textContent = "서버 연결 오류";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
