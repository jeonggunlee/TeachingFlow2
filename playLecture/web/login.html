<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — HALLYM EDUTECH</title>
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/css/auth.css?v=2" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">HALLYM EDUTECH</div>
    <h1 class="auth-title">로그인</h1>
    <p class="auth-sub">강의를 수강하려면 로그인하세요.</p>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="username">아이디</label>
        <input id="username" type="text" placeholder="아이디 입력" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required />
      </div>
      <p id="login-error" class="auth-error"></p>
      <button type="submit" class="auth-btn">로그인</button>
    </form>

    <div class="auth-footer">
      계정이 없으신가요? <a href="/register">회원가입</a>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  // 이미 로그인된 경우 리다이렉트
  if (Auth.isLoggedIn()) {
    const next = new URLSearchParams(location.search).get("next") || "/";
    location.href = next;
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("login-error");
    errEl.textContent = "";
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/auth/login", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.detail || "로그인 실패"; return; }

      Auth.setAuth(data.token, data.user);
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.href = next;
    } catch (err) {
      errEl.textContent = "서버 연결 오류";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
